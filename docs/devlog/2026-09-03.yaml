  changes:
    - "Authored the definitive orientation chronicle content/Wiki/philchat.mdx synthesising culture, factions, dramatis personae, liturgical rituals, and historical sagas across all 8 editions of The Phil Chat Times."
    - "Reorganised content/Wiki/index.md to feature philchat prominently at the top, grouping articles into curated directories (The Great Sagas & Chronicles, Community Profiles, Concepts & Channel Folklore, Canonical Philosophers, Contribute & Guidelines)."
    - "Suppressed music playback and dock interfaces on all Wiki surfaces (QuickControls, AppShell, and MobileMusicBar) so the wiki remains an unpolluted scholarly reading environment."
    - "Bound reader mode click action in ReaderToggle and CornerMenu to open the theme/typography backslash menu directly, exposing text size scale, line height, and reading measure controls."
    - "Optimised content search with instant synchronous in-memory indexing fallback, global slash key trigger, and category badge annotations (Chatter, Concept, Event, Philosopher, Wiki, Book, Movie, Music, Daily)."
    - "Redesigned search overlay to be minimal, seamless, and free of blur and heavy strokes, with unified spotlight modal and keyboard scroll anchoring."
    - "Removed all emoji from UI components, headers, and prose."
    - "Added CopyWikilinkButton to wiki article headers for instant clipboard copying of canonical [[Note|Title]] links."
  decisions:
    - "Philchat orientation is placed at the top of the Wiki index to serve as the narrative onboarding anchor for all subsequent articles, chronicles, and surveys."
    - "Music bar is suppressed on both wiki shell and any /wiki/ route to honour the request for a dedicated, uninterrupted wiki reading environment."
    - "Reader mode icon opens the backslash ThemePanel where typography, scale, and reader mode settings live, solving the discoverability problem for non-keyboard users."
    - "Search overlay was streamlined into a single unified container without glassmorphism blur or heavy borders, providing a lightweight, unobtrusive experience."
  next: "Bring interactive terminal personas and spectator debate commands to the chat surfaces."

- date: 2026-09-03
  area: chat
  title: "Server-side bot command dispatcher and interactive personas for chat surfaces"
  status: done
  files:
    - src/worker/chatBot.ts
    - src/worker/index.ts
    - src/components/ui/chat/ChatRoom.tsx
    - src/components/ui/chat/ChatAutocomplete.tsx
    - src/components/ui/chat/MessageList.tsx
    - src/components/ui/chat/TerminalChatView.tsx
    - src/hooks/useChatMessages.ts
    - src/types/chat.ts
  changes:
    - "Implemented POST /api/chat/command in Cloudflare Worker with support for /debate, /ask, /yellowcard, /tape, /philquote, and /bothelp."
    - "Equipped /debate with room concurrency locks, a 35-second cooldown, 6-turn scripted exchange with topic continuity, and authentic bot usernames and colors."
    - "Wired chat autocomplete and terminal chat view dispatchers across Wiki SideChat and ChatRoom surfaces."
    - "Fixed real-time message enrichment in useChatMessages to prioritize denormalized bot usernames so that bot messages render with authentic personas for all room participants."
  decisions:
    - "Option B (server-side worker bot dispatch) was chosen to ensure authentic bot identities (name, color, and avatar) rather than user-attributed brackets."
    - "Debate turns are dispatched sequentially via waitUntil with realistic pacing intervals (1.8s-2.0s) so participants experience real-time dialogue in the room."
  next: "Restore classic Wiki top-bar layout while preserving floating center search, and clean up wikilink basenames."

- date: 2026-09-03
  area: wiki
  title: "Restoration of classic top bar controls, floating center search, and wikilink syntax cleanup"
  status: done
  files:
    - src/components/layout/WikiShell.tsx
    - src/components/layout/WikiShell.module.scss
    - src/components/ui/wiki/WikiSearchBox.tsx
    - src/components/ui/wiki/WikiSearchBox.module.scss
    - content/Wiki/index.md
    - content/Wiki/philchat.mdx
    - content/Wiki/About.md
    - content/Wiki/Concepts/
    - content/Wiki/Events/
    - content/Wiki/Philosophers/
    - content/Wiki/chatters/
  changes:
    - "Restored classic TerminalTitle ('Philchat Wiki' and 'notes | chat' nav) at top left and QuickControls at top right on WikiShell."
    - "Extracted center search box into floating WikiSearchBox component positioned between left and right controls with instant dropdown and slash shortcut."
    - "Removed redundant top banner (WikiHeader) and top-bar breadcrumbs since NoteRenderer already renders page breadcrumbs in note headers."
    - "Fixed 'The Great Sagas & Chronicles' table on content/Wiki/index.md by removing column-splitting pipe characters from wikilinks."
    - "Converted all full 'Wiki/...' link paths across all wiki notes into clean, bare basename wikilinks ([[Note Title]]), preserving explicit qualification only for true collisions."
  decisions:
    - "WikiSearchBox floats at fixed top: 12px, left: 50% without a background banner, preserving the original visual hierarchy while retaining instant search."
    - "Markdown tables cannot contain bare pipes inside wikilinks without breaking column layout; using bare basename links [[The Evolution Deliberation]] natively resolves this without fragile escaping."
  next: "Design bespoke editorial components for broadsheet cards and replace codeblock diagrams."

