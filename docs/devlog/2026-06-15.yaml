- date: 2026-06-15
  area: garden
  title: Boot TUI rescue, a11y + CLS + reading progress, generative OG cards for every page
  status: done
  files:
    - src/features/boot/bootGenerators.ts
    - src/features/boot/BootPage.tsx
    - src/features/boot/bootSeed.ts
    - src/router.tsx
    - src/components/ui/SkipToContent.tsx
    - src/components/layout/AppShell.tsx
    - src/components/layout/WikiShell.tsx
    - src/components/layout/ChatShell.tsx
    - scripts/prebuild.ts
    - src/lib/rehype-image-paths.ts
    - src/components/ui/ReadingProgress.tsx
    - src/components/ui/ArticleLayout.tsx
