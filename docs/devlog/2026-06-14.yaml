  changes:
    - Music is now SoundCloud-driven. `npm run sync:music` (scripts/sync-music.ts) pulls tracks via yt-dlp, transcodes to a size-targeted ~5MB MP3, extracts cover art, uploads audio + covers to the Cloudflare R2 bucket `subsurfaces-music`, and regenerates public/music.json. All 39 SoundCloud tracks synced.
    - public/music.json is now the committed source of truth (no longer generated by prebuild, no longer gitignored). MusicContext streams from absolute R2 URLs with crossOrigin=anonymous; MusicPlayer shows the current track's cover. R2 CORS policy applied (scripts/r2-cors.json).
    - On-disk mp3s + their note frontmatter retired; old per-track notes kept as optional liner notes. The 18-note "Stand Alone Complex" AI cluster + 2 Moltbook notes deleted; the machine-god note rebuilt as a real <MachineGod /> component (oracle, ROT-N cipher, Conway's Life) after its inline-style/script version crashed under MDX.
    - New arcade: Snake (wrapping walls, slow-mo bloom), Tetris, 2048 (ROYGBIV tiles), Blackjack (dramatic dealer play-out), Hex Mines, Murmuration (boids), Sandbox (falling-sand), Ant Farm (pheromone foraging). Shared synthesized Web Audio SFX in src/lib/sfx.ts (no audio files). StarWeft (star.subsurfaces.net) featured.
    - Murmuration is the new default background — ~460 boids, simplex wind current, cursor-flee, semi-opaque, spatial-hash neighbours (BgCanvas drawMurmuration).
    - New "game" page layout — bare, wide, full-bleed; games break out of the article box. data-fullbleed opts a page out of the stage width cap.
    - Living Constellation (ConstellationPage) — the note-graph as a drifting star map (stars=notes by degree/tag, links=lines, twinkle, zoom-to-cursor, zoom-threshold labels, garden stats + tools). Replaces the radar GraphView in the Knowledge Map overlay and /graph. LocalGraph footer renamed "Neighborhood" and minimized by default.
    - Fixes — embedded system pages render in panel cards (NoteBody now registry-driven); horizontal scroll pingback when opening notes (deferred scrollIntoView + overflow-anchor:none); telescopic CRLF parser bug (flattened nested blocks); index footnote now parses; hexo zen-X overlap + fullscreen grid scaling; mobile pass (floating-control overlaps, Snake swipe + Tetris touch pad); hover previews dismiss promptly (split open/hide delays); Tetris hard-drop crash before play (guarded, per Codex review).
  decisions:
    - SoundCloud as single source of truth, synced locally on demand (not at deploy) — Cloudflare's build image has no yt-dlp/ffmpeg and re-downloading every deploy would be slow/fragile. Audio on R2 (free tier, no egress) keeps the repo lean.
    - public/music.json committed and prebuild made to never clobber it — the manifest is the record of what's live, so a fresh build/checkout must not regenerate an empty one.
    - SFX synthesized via Web Audio rather than sourced files — dependency-free, instant, matches the minimal aesthetic; respects a persisted mute.
    - Adding a game/page stays one line in src/config/system-pages.ts; NoteBody reads SYSTEM_PAGES so embedded panels need no per-page change.
    - Constellation kept distinct from /graph's old force-graph — contemplative vs utilitarian; old GraphView retired from overlay + route but left in git history.
    - Git history rewritten with filter-repo to drop ~260MB of retired WAV/MP3 audio (489MB -> 222MB .git); force-pushed after a verified mirror backup (since removed).
  next: Optional constellation "guided tour" mode; music-reactive generative art (FFT analyser already available); a "what changed" timeline. Old branch fix/auth-redirect-and-chat-scroll pushed to origin, awaiting review/merge.
