- date: 2026-07-27
  area: garden
  title: "FILAMENT fullscreen simulation interface"
  status: done
  files:
    - src/features/filament/FilamentPage.tsx
    - src/features/filament/FilamentPage.module.scss
    - src/features/filament/sim.worker.ts
    - src/components/layout/AppShell.tsx
    - src/components/layout/QuickControls.tsx
  changes:
    - "Replaced FILAMENT's 600px GameCabinet presentation with a native 100vw x 100dvh simulation surface. The density canvas now owns the complete viewport with no article padding, border, header, local graph, mobile music bar, or bottom corner menu."
    - "Added a minimal floating interface: persistent playback and replay controls, a cosmic clock HUD, and a collapsible options panel organised into World (scenario and seed), View (luminous events, trails, follow, exposure, camera reset), and Solver (particle scale, multipole order, and live performance readout) tabs."
    - "Kept the garden QuickControls floating at the top-right, including the Arcade return action. On FILAMENT, irrelevant background and reader controls are omitted; the compact bar remains available on phones in place of the hidden CornerMenu."
    - "Completed the viewport interaction model with cursor-anchored wheel zoom, two-finger pinch zoom and pan, pointer capture, double-click reset, arrow-key panning, plus/minus zoom, Home/0 reset, labelled canvas instructions, pressed states, and keyboard-operable ARIA tabs."
    - "Made pause a real pause. A zero-substep worker no longer continuously renders or advances luminous-event time; view, palette, parameter, and resize changes request a single fresh frame, with deferred requests preserved until a recycled buffer is available."
    - "Verified the final source with the full npm run check pipeline (numerical FMM/cosmology tests, repository tests, lint, SPA and Worker typechecks, and production build), followed by a second production build, targeted lint, and git diff --check. Existing lint warnings and five known broken wikilinks were unchanged."
  decisions:
    - "FILAMENT is an immersive scientific instrument rather than a conventional arcade cabinet. Its page owns its interface directly; GameCabinet remains unchanged for smaller score-and-board games."
    - "Immersive mode is derived from the canonical route slug in AppShell instead of waiting for the active-layout store effect. This prevents a direct /filament visit from briefly mounting the animated site title or loading the heavy LocalGraph chunk."
    - "The parameter taxonomy follows user intent rather than implementation detail: World changes initial conditions, View changes presentation and camera behaviour, and Solver changes computational resolution or exposes diagnostics. Playback remains outside the tabs because it is always relevant."
    - "The render-resolution cap and transferable two-buffer backpressure were retained. Fullscreen changes CSS geometry, not the simulation's memory and frame-budget safeguards."
    - "No live browser visual pass was possible because the browser-control surface was unavailable in the session; the production Sass/Vite build is verified, but final visual QA remains the next boundary."
  next: "Open the deployed /filament for a desktop and phone visual pass; follow up only if the live rendering reveals a layout issue."

- date: 2026-07-27
  area: filament
  title: "Periodic large-scale simulation overhaul"
  status: done
  files:
    - src/features/filament/particle-mesh.ts
    - src/features/filament/quality.ts
    - src/features/filament/presets.ts
    - src/features/filament/universe.ts
    - src/features/filament/sim.worker.ts
    - src/features/filament/protocol.ts
    - src/features/filament/FilamentPage.tsx
    - src/features/filament/FilamentPage.module.scss
    - src/components/layout/QuickControls.module.scss
    - src/components/ui/games/ArcadePage.tsx
    - scripts/test-fmm.ts
  changes:
    - "Rebuilt Cosmos around a periodic particle-mesh gravity solver with CIC deposition and interpolation, a radix-2 FFT Poisson solve, periodic drift, and hundreds of seeded Fourier modes. Both displayed particle populations now gravitate; the FMM remains the higher-precision solver for isolated disc, collision, and collapse worlds."
    - "Replaced separate scale, multipole-order, and solver-facing choices with three coordinated Fidelity profiles. Auto, Deep, and Vast jointly select particle count, mesh resolution, FMM order, and adaptive render-pixel bounds; the default Cosmos now advances roughly five times faster than the previous desktop default while simulating three times as many gravitating particles."
    - "Added render-budget feedback across the Worker draw and main-thread canvas upload, a solver-independent density/event interface, resolution-limit diagnostics, explicit non-finite checks, and a visible recoverable fault state so numerical failures can no longer remain silent."
    - "Kept quasars and starbursts strictly observational. Event discovery now samples solver density at 10 Hz and normalises flash probability by physical mass, preventing mesh resolution from changing event rates or allowing a visual quasar to masquerade as a force source."
    - "Simplified the options into one borderless, transparent control surface aligned with the garden's existing typography. World, Fidelity, Events, Trails, Brightness, seed, view reset, and optional diagnostics remain; tabs, panel strokes, filled controls, and low-level scale/order inputs were removed."
    - "Expanded numerical coverage with FFT round-trip, uniform periodic equilibrium, growth, momentum, long-horizon concentration, and exact 6000-step shipping-timestep regressions while retaining the direct N-squared FMM convergence suite."
  decisions:
    - "Periodic particle mesh is the correct large-scale model for Cosmos: it removes the artificial open-patch edge and mean-background correction, amortises global gravity on a fixed grid, and naturally supports much larger all-gravitating populations."
    - "FMM and particle mesh are complementary scenario backends behind one Universe interface, not competing user presets. Fidelity describes the visible quality/performance tradeoff; implementation choices stay in diagnostics."
    - "A densest-cell mass fraction is exposed as a simulation-health signal. Quasars are read-only annotations of that density, so a future concentration regression is reported directly instead of failing silently."
  verification:
    - "npx tsx scripts/test-fmm.ts passed, including a 6000-step recombination-to-present run with 2.44 percent peak-cell concentration."
    - "npx tsc --noEmit passed."
    - "npm run lint passed with 0 errors and the repository's 25 pre-existing warnings."
    - "npm run build passed; git diff --check passed. The combined npm run check reached the production build after every preceding stage passed, then exceeded the 60-second command timeout; that build was run and passed separately."
  next: "Perform the existing desktop and phone visual-QA boundary on /filament; tune only presentation defaults unless the new health diagnostic reports a genuine numerical limit."

- date: 2026-07-27
  area: filament
  title: "Continuous density rendering and stable adaptive fidelity"
  status: done
  files:
    - src/features/filament/density-raster.ts
    - src/features/filament/FilamentPage.tsx
    - src/features/filament/sim.worker.ts
    - src/features/filament/particle-mesh.ts
    - src/features/filament/universe.ts
    - src/features/filament/quality.ts
    - src/features/filament/protocol.ts
    - scripts/test-fmm.ts
  changes:
    - "Removed both sources of visible flicker. The adaptive controller now changes only an internal density raster while a fixed high-resolution display canvas retains the last complete frame, and Cosmos reconstructs the continuous force-mesh density instead of snapping individual particles to their nearest display pixel."
    - "Added conservative CIC splatting for isolated scenarios, high-quality final reconstruction, time-based trail decay, slower wall-time exposure adaptation, a non-blank first exposure frame, conservative trail-history resampling across internal resolution changes, and replaced the misleading 22 percent quasar pulse with subtle slow variability."
    - "Replaced the 1.2-second reactive scaler with an EMA, asymmetric thresholds, sustained-sample requirements, and a 4.5-second dwell. Short expensive frames can no longer make quality hunt up and down."
    - "Precomputed FFT stage rotations, the discrete Poisson Green function, and periodic neighbour indices; replaced hot-loop modulo operations with bounded branches; and fused the first cosmological kick, drift, and wrap into one memory pass."
    - "Added density-raster diagnostics and regression coverage for CIC mass conservation, continuous sub-pixel motion, energy-preserving resizes, and frame-rate-independent trail persistence."
  decisions:
    - "Particle positions below the particle-mesh cell scale are Monte Carlo samples, not additional resolved structure. Rendering the solver's continuous density is both more physically faithful and substantially cheaper than presenting that sampling noise as high-frequency detail."
    - "Adaptive resolution is an internal implementation detail. The displayed canvas should change dimensions only with the viewport; quality changes are composited atomically behind the retained previous frame."
    - "Presentation persistence is measured in wall time, not frames, so a slower device sees the same trail length and exposure behaviour as a faster device."
  verification:
    - "A live Chrome comparison on the same Auto scene reduced representative Worker timings from about 26.3 ms simulation plus 20.5 ms drawing to 12.8 ms simulation plus 7.2 ms drawing, while replacing point shimmer with a continuous cosmic-web field."
    - "The headless 60k-particle Auto benchmark averaged 9.23 ms per particle-mesh step after warm-up."
    - "The full npm run check pipeline passed: repository and numerical tests, lint, SPA and Worker typechecks, prebuild, and production build. Lint retained the repository's existing 25 warnings and introduced no Filament warning; the five known broken wikilinks and missing filament OG card warning were unchanged."
  next: "Keep the solver-native density path as the Cosmos renderer; reserve future GPU work for substantially larger three-dimensional or multi-layer fields rather than reintroducing sub-grid particle noise."
