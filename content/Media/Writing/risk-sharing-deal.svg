<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" font-family="ui-monospace, 'IBM Plex Mono', Consolas, monospace">
  <title>Mutual gains from sharing opposite risks</title>
  <desc>Before a deal, agents A and B alternate between 100 and 25 resources across two equally likely states. After a deal, each gets 62.5 in both states and both gain expected utility.</desc>
  <defs>
    <marker id="share-arrow" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0.5 L7,4 L0,7.5 z" fill="#b4424c"/>
    </marker>
  </defs>

  <text x="70" y="42" font-size="12" letter-spacing="2" fill="#9a9aa2">TWO AGENTS, ONE DEAL</text>
  <text x="850" y="42" font-size="10" fill="#9a9aa2" opacity="0.7" text-anchor="end">two states, each 50% likely</text>

  <text x="245" y="88" font-size="11" letter-spacing="1.5" fill="#9a9aa2" text-anchor="middle">BEFORE - NO DEAL</text>
  <text x="675" y="88" font-size="11" letter-spacing="1.5" fill="#b4424c" text-anchor="middle">AFTER - SHARE RISK</text>

  <g transform="translate(70,112)">
    <rect width="350" height="270" rx="8" fill="none" stroke="#8a8a92" stroke-width="1.25"/>
    <line x1="0" y1="58" x2="350" y2="58" stroke="#8a8a92" opacity="0.35"/>
    <line x1="175" y1="0" x2="175" y2="173" stroke="#8a8a92" opacity="0.35"/>
    <text x="87" y="36" font-size="10" fill="#9a9aa2" text-anchor="middle">STATE 1</text>
    <text x="263" y="36" font-size="10" fill="#9a9aa2" text-anchor="middle">STATE 2</text>

    <text x="24" y="92" font-size="10" fill="#8a8a92">A</text>
    <rect x="48" y="75" width="110" height="24" rx="3" fill="#8a8a92" opacity="0.75"/>
    <text x="103" y="92" font-size="10" fill="#ffffff" text-anchor="middle">100</text>
    <text x="199" y="92" font-size="10" fill="#8a8a92">A</text>
    <rect x="223" y="75" width="28" height="24" rx="3" fill="#8a8a92" opacity="0.45"/>
    <text x="265" y="92" font-size="10" fill="#8a8a92">25</text>

    <text x="24" y="140" font-size="10" fill="#8a8a92">B</text>
    <rect x="48" y="123" width="28" height="24" rx="3" fill="#8a8a92" opacity="0.45"/>
    <text x="90" y="140" font-size="10" fill="#8a8a92">25</text>
    <text x="199" y="140" font-size="10" fill="#8a8a92">B</text>
    <rect x="223" y="123" width="110" height="24" rx="3" fill="#8a8a92" opacity="0.75"/>
    <text x="278" y="140" font-size="10" fill="#ffffff" text-anchor="middle">100</text>

    <line x1="24" y1="173" x2="326" y2="173" stroke="#8a8a92" opacity="0.25"/>
    <text x="175" y="202" font-size="10" fill="#9a9aa2" text-anchor="middle">each averages 62.5 resources</text>
    <text x="175" y="228" font-size="10" fill="#8a8a92" text-anchor="middle">expected utility</text>
    <text x="175" y="253" font-size="24" fill="#8a8a92" text-anchor="middle">7.50</text>
  </g>

  <path d="M438,247 H482" fill="none" stroke="#b4424c" stroke-width="1.75" marker-end="url(#share-arrow)"/>
  <text x="460" y="228" font-size="9.5" fill="#b4424c" text-anchor="middle">deal</text>

  <g transform="translate(500,112)">
    <rect width="350" height="270" rx="8" fill="#b4424c" fill-opacity="0.035" stroke="#b4424c" stroke-width="1.5"/>
    <line x1="0" y1="58" x2="350" y2="58" stroke="#b4424c" opacity="0.3"/>
    <line x1="175" y1="0" x2="175" y2="173" stroke="#b4424c" opacity="0.3"/>
    <text x="87" y="36" font-size="10" fill="#b4424c" text-anchor="middle">STATE 1</text>
    <text x="263" y="36" font-size="10" fill="#b4424c" text-anchor="middle">STATE 2</text>

    <text x="24" y="92" font-size="10" fill="#b4424c">A</text>
    <rect x="48" y="75" width="70" height="24" rx="3" fill="#b4424c" opacity="0.75"/>
    <text x="83" y="92" font-size="10" fill="#ffffff" text-anchor="middle">62.5</text>
    <text x="199" y="92" font-size="10" fill="#b4424c">A</text>
    <rect x="223" y="75" width="70" height="24" rx="3" fill="#b4424c" opacity="0.75"/>
    <text x="258" y="92" font-size="10" fill="#ffffff" text-anchor="middle">62.5</text>

    <text x="24" y="140" font-size="10" fill="#b4424c">B</text>
    <rect x="48" y="123" width="70" height="24" rx="3" fill="#b4424c" opacity="0.75"/>
    <text x="83" y="140" font-size="10" fill="#ffffff" text-anchor="middle">62.5</text>
    <text x="199" y="140" font-size="10" fill="#b4424c">B</text>
    <rect x="223" y="123" width="70" height="24" rx="3" fill="#b4424c" opacity="0.75"/>
    <text x="258" y="140" font-size="10" fill="#ffffff" text-anchor="middle">62.5</text>

    <line x1="24" y1="173" x2="326" y2="173" stroke="#b4424c" opacity="0.22"/>
    <text x="175" y="202" font-size="10" fill="#b4424c" text-anchor="middle">each still averages 62.5</text>
    <text x="175" y="228" font-size="10" fill="#b4424c" text-anchor="middle">utility for each</text>
    <text x="175" y="253" font-size="24" fill="#b4424c" text-anchor="middle">7.91</text>
  </g>

  <line x1="70" y1="425" x2="850" y2="425" stroke="#8a8a92" opacity="0.25"/>
  <g font-size="10.5">
    <text x="100" y="459" fill="#9a9aa2">total resources</text>
    <text x="315" y="459" fill="#8a8a92">125 in either state</text>
    <text x="594" y="459" fill="#b4424c">unchanged</text>

    <text x="100" y="490" fill="#9a9aa2">spread of outcomes</text>
    <text x="315" y="490" fill="#8a8a92">wide and opposed</text>
    <text x="594" y="490" fill="#b4424c">flat for both</text>
  </g>

  <text x="850" y="522" font-size="10.5" fill="#b4424c" text-anchor="end">same stock / better allocation / both gain</text>
</svg>
