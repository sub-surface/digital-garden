name = "digital-garden-v2"
compatibility_date = "2024-04-03"
main = "src/worker.ts"

[observability.logs]
enabled = true
invocation_logs = true

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
binding = "ASSETS"
# Without this, CF serves dist/index.html directly for "/" and the Worker never
# runs — so injectMetaTags() is skipped and the homepage ships no og: tags.
# Deep routes (/arcade, …) have no matching file, so they already hit the Worker.
run_worker_first = ["/", "/index.html"]

[vars]
NODE_VERSION = "20"

[build]
command = "npm run build"

[[routes]]
pattern = "subsurfaces.net"
custom_domain = true

[[routes]]
pattern = "www.subsurfaces.net"
custom_domain = true

[[routes]]
pattern = "wiki.subsurfaces.net"
custom_domain = true

[[routes]]
pattern = "chat.subsurfaces.net"
custom_domain = true

[[routes]]
pattern = "os.subsurfaces.net"
custom_domain = true

[[send_email]]
name = "EMAIL"
