name = "digital-garden-v2"
compatibility_date = "2024-04-03"
main = "src/worker.ts"

[observability.logs]
enabled = true
invocation_logs = true

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
binding = "ASSETS"
# Run the Worker for ALL requests. Without this, CF serves dist/index.html
# directly for "/" and the Worker never runs, so injectMetaTags() is skipped and
# the homepage ships no og: tags.
#
# NB: must be the boolean `true`, NOT an array of paths. The array form is
# *exclusive* — only the listed routes invoke the Worker and everything else is
# served assets-first with no Worker fallback, which silently breaks every
# /api/* route (→ SPA HTML) and disables per-route OG/meta injection on all
# non-listed pages. `true` runs the Worker everywhere; non-HTML assets pass
# straight through (see worker/index.ts: non-GET / non-HTML returns as-is).
run_worker_first = true

# Build Node version is set in the CF dashboard (Settings → Build → Variables:
# NODE_VERSION=24). A [vars] entry here would only be a runtime binding.

[build]
command = "npm run build"

[[routes]]
pattern = "subsurfaces.net"
custom_domain = true

[[routes]]
pattern = "www.subsurfaces.net"
custom_domain = true

[[routes]]
pattern = "wiki.subsurfaces.net"
custom_domain = true

[[routes]]
pattern = "chat.subsurfaces.net"
custom_domain = true

[[routes]]
pattern = "os.subsurfaces.net"
custom_domain = true

[[send_email]]
name = "EMAIL"

# Per-user/IP rate limit for write endpoints (POST/PUT/PATCH/DELETE on /api/*).
# The Worker degrades gracefully if this binding is absent (local dev).
[[unsafe.bindings]]
name = "WRITE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# The site's own storage (docs/backend.md). D1 "subsurfaces": desk drafts and
# history, wiki bookkeeping, bookmarks, API keys. R2 "subsurfaces-media" is
# private; the Worker serves from it (desk/ admin only, avatars/ public).
# Schema: docs/migrations/d1, applied with
#   npx wrangler d1 migrations apply subsurfaces --remote
[[d1_databases]]
binding = "DB"
database_name = "subsurfaces"
database_id = "f6b962a1-0057-4343-a247-bb52d9a38570"
migrations_dir = "docs/migrations/d1"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "subsurfaces-media"

# Live chat: one Durable Object per room fans out new messages and typing over
# hibernating WebSockets (src/worker/chatLive.ts). SQLite-backed, as the Free
# plan requires, though it keeps nothing: the record is in D1.
[[durable_objects.bindings]]
name = "CHAT_ROOMS"
class_name = "ChatRoom"

[[migrations]]
tag = "v1-chat-rooms"
new_sqlite_classes = ["ChatRoom"]
